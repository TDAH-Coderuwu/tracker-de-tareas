<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta id="pwa-theme-color" name="theme-color" content="#f6f7fb">
<script>
  try {
    const saved = JSON.parse(localStorage.getItem('ritmo.personal.v1') || 'null');
    const appearance = saved?.settings?.appearance || (saved?.settings?.theme === 'dark' ? 'dark' : 'light');
    const systemNavColor = ['dark', 'custom', 'complementary'].includes(appearance) ? '#000000' : '#f6f7fb';
    document.getElementById('pwa-theme-color').content = systemNavColor;
    document.documentElement.style.setProperty('--system-nav-bg', systemNavColor);
  } catch (_) {}
</script>
<meta name="description" content="Tracker de tareas :D — organiza hábitos, tareas y proyectos personales.">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Tracker">
<link rel="manifest" href="manifest.webmanifest?v=20261106-global-theme">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<title>Tracker de tareas :D</title>
<link rel="stylesheet" href="style.css?v=20261108-date-editor">
</head>
<body>
<div class="app-shell" id="app"></div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<script src="app.js?v=20261108-date-editor" defer></script>
</body>
</html>
